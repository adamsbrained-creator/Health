name: Build Health

# Works with a project .zip in the repo root (or with loose project files).
# Runs on every push to main, or by hand from the Actions tab.
# Output: Health.apk (signed with the temporary key in keystore/health.jks) on the Releases page.
# Every build gets a higher versionCode (the run number), so each new APK installs over the old one.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find the project (unpack the zip if needed)
        run: |
          if [ -f settings.gradle.kts ]; then
            ROOT=.
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
            if [ -z "$ZIP" ]; then
              echo "No settings.gradle.kts and no .zip in the repo root."; exit 1
            fi
            echo "Unpacking $ZIP"
            mkdir -p _project
            unzip -q -o "$ZIP" -d _project
            FOUND=$(find _project -name settings.gradle.kts | head -1)
            if [ -z "$FOUND" ]; then
              echo "The zip has no settings.gradle.kts inside."; exit 1
            fi
            ROOT=$(dirname "$FOUND")
          fi
          ROOT=$(realpath "$ROOT")
          echo "Project root: $ROOT"
          if [ ! -f "$ROOT/keystore/health.jks" ]; then
            echo "Missing keystore/health.jks in the project."; exit 1
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build signed APK
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Package APK
        run: |
          set -e
          APK="$ROOT/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found, listing outputs:"; find "$ROOT/app/build/outputs" -type f; exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Health.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs dist/Health.apk | head -5
          fi
          ls -la dist

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Health
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: dist/*
